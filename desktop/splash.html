<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>妆点管账 · 启动中</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(circle at 18% 8%, #ffd9e6 0%, #dd7aa7 38%, #742a54 100%);
    color: #fff; display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-drag: none;
  }
  .card { width: 420px; text-align: center; padding: 20px; }
  .logo {
    width: 108px; height: 108px; border-radius: 26px; display: block; margin: 0 auto 26px;
    box-shadow: 0 18px 42px rgba(120, 20, 12, .32);
  }
  h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 4px; font-weight: 700; }
  .sub { margin: 0 0 34px; font-size: 13px; letter-spacing: 2px; opacity: .82; }
  .track { height: 6px; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; }
  .bar { height: 100%; width: 8%; border-radius: 99px; background: #fff;
         transition: width .45s ease; box-shadow: 0 0 14px rgba(255,255,255,.7); }
  #status { margin-top: 18px; font-size: 14px; opacity: .95; min-height: 22px; }
  #hint { margin-top: 10px; font-size: 12px; opacity: .68; line-height: 1.7; }
  #retry {
    display: none; margin: 22px auto 0; padding: 9px 26px; border: 1px solid rgba(255,255,255,.8);
    border-radius: 99px; background: rgba(255,255,255,.16); color: #fff; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  #retry:hover { background: rgba(255,255,255,.3); }
  .err #bar { background: #ffe08a; }
  .err #status { color: #fff3cd; }
</style>
</head>
<body>
  <div class="card" id="card">
    <img class="logo" src="icon.png" alt="妆点管账" />
    <h1>妆点管账</h1>
    <p class="sub">本地离线版 · 数据只在这台电脑</p>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div id="status">正在启动…</div>
    <div id="hint">首次启动会自动拉起本地服务，全程无需终端</div>
    <button id="retry">重新尝试</button>
  </div>
<script>
  const bar = document.getElementById('bar');
  const status = document.getElementById('status');
  const hint = document.getElementById('hint');
  const card = document.getElementById('card');
  const retry = document.getElementById('retry');
  window.__setStatus = function (text, percent, isError) {
    status.textContent = text;
    if (typeof percent === 'number') bar.style.width = Math.max(4, percent) + '%';
    card.classList.toggle('err', !!isError);
    if (isError) {
      hint.textContent = '可检查 logs/desktop-*.log，或关闭窗口后重新双击桌面图标';
      retry.style.display = 'inline-block';
    } else {
      retry.style.display = 'none';
    }
  };
  retry.addEventListener('click', function () {
    if (window.desktop && window.desktop.retry) window.desktop.retry();
  });
</script>
</body>
</html>
