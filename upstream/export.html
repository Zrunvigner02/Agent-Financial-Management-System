<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>报表导出中心 · 妆点管账</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<style>
  :root { --plum:#742a54; --rose:#d870a0; --pale:#fff5f9; --line:#f0d9e5; --muted:#9b7189; }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 32px 48px; background:var(--pale); color:#4a2438;
         font-family:"Microsoft YaHei","Segoe UI",sans-serif; }
  header { display:flex; align-items:center; gap:16px; max-width:1080px; margin:0 auto 26px; }
  .logo { width:52px; height:52px; border-radius:15px; flex:none;
          background:linear-gradient(135deg,#fccddc,#742a54); color:#fff; font-size:29px;
          font-weight:700; display:flex; align-items:center; justify-content:center;
          box-shadow:0 8px 22px rgba(116,42,84,.22); }
  h1 { font-size:23px; margin:0; letter-spacing:2px; }
  .sub { color:var(--muted); font-size:13px; margin-top:5px; }
  .back { margin-left:auto; color:var(--plum); text-decoration:none; font-size:13px;
          border:1px solid var(--line); background:#fff; padding:9px 16px; border-radius:99px; }
  .back:hover { background:#fce9f2; }
  .wrap { max-width:1080px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px 24px;
          box-shadow:0 5px 22px rgba(116,42,84,.06); }
  .card.full { grid-column:1 / -1; }
  h2 { font-size:15px; margin:0 0 18px; color:var(--plum); letter-spacing:1px;
       display:flex; align-items:center; gap:8px; }
  h2::before { content:""; width:4px; height:15px; border-radius:4px; background:var(--rose); }
  label { display:block; font-size:12px; color:var(--muted); margin:0 0 6px; letter-spacing:.5px; }
  select, input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
                  background:#fffbfd; color:#4a2438; font-size:14px; font-family:inherit; outline:none; }
  select:focus, input:focus { border-color:var(--rose); box-shadow:0 0 0 3px rgba(216,112,160,.13); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .btn { margin-top:8px; width:100%; padding:11px; border:0; border-radius:9px; cursor:pointer;
         background:linear-gradient(120deg,#d870a0,#742a54); color:#fff; font-size:14px;
         letter-spacing:2px; font-family:inherit; }
  .btn:hover { filter:brightness(1.06); }
  .btn.ghost { background:#fff; color:var(--plum); border:1px solid var(--line); }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .pill { display:inline-block; padding:3px 10px; border-radius:99px; font-size:11px;
          background:#fbe7f0; color:var(--plum); margin:0 6px 6px 0; }
  .status { margin-top:14px; padding:11px 14px; border-radius:9px; font-size:13px; line-height:1.7;
            background:#fff3f8; border:1px solid var(--line); color:var(--muted); }
  .status.err { background:#fff0f0; border-color:#f3c9c9; color:#a63c3c; }
  .status.ok { background:#f0faf3; border-color:#c9e8d2; color:#2e7d4f; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--line); }
  td { padding:9px 10px; border-bottom:1px solid #faf0f5; }
  .act { color:var(--plum); cursor:pointer; text-decoration:underline; }
  .empty { color:var(--muted); font-size:13px; padding:16px 0; }
  .note { font-size:12px; color:var(--muted); line-height:1.8; margin-top:12px; }
  @media (max-width:860px) { .wrap { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div class="logo">&yen;</div>
  <div>
    <h1>报表导出中心</h1>
    <div class="sub">振颜丽舍 · 妆点管账 ｜ 本地生成，数据只在这台电脑</div>
  </div>
  <a class="back" href="/dashboard">返回主界面</a>
</header>

<div class="wrap">
  <section class="card">
    <h2>生成报表</h2>
    <div class="row">
      <div><label>报表类型</label><select id="kind"></select></div>
      <div><label>会计期间</label><input id="period" type="month" /></div>
    </div>
    <label>导出格式（内置）</label>
    <select id="format">
      <option value="xlsx">XLSX · Excel 工作簿</option>
      <option value="csv">CSV · 通用表格（可交给 Filee 再转换）</option>
      <option value="html">HTML · 可直接打印为 PDF</option>
      <option value="md">Markdown · 文档</option>
      <option value="json">JSON · 结构化数据</option>
    </select>
    <button class="btn" id="gen">生成并下载</button>
    <div class="status" id="genStatus">选择报表与期间后点击生成。</div>
  </section>

  <section class="card">
    <h2>Filee 格式转换</h2>
    <label>选择已导出的文件</label>
    <select id="srcFile"></select>
    <div class="row" style="margin-top:14px">
      <div>
        <label>目标格式</label>
        <select id="to"><option value="pdf">pdf</option><option value="docx">docx</option>
        <option value="xlsx">xlsx</option><option value="ods">ods</option><option value="csv">csv</option>
        <option value="png">png</option><option value="md">md</option><option value="html">html</option>
        <option value="txt">txt</option></select>
      </div>
      <div style="display:flex;align-items:flex-end"><button class="btn ghost" id="conv">转换</button></div>
    </div>
    <div class="status" id="fileeStatus">正在读取格式清单…</div>
    <div class="note">Filee 是独立的文件格式转换器（C# / .NET 10，MIT）。本系统通过命令行调用它，
      不会把 .NET 运行时打包进来；未安装时内置格式仍可正常导出。</div>
  </section>

  <section class="card full">
    <h2>导出记录 <span style="font-weight:400;color:var(--muted);font-size:12px">（.local/exports）</span></h2>
    <div id="files" class="empty">加载中…</div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const token = sessionStorage.getItem('jl_token') || '';
const setId = sessionStorage.getItem('jl_set_id') || '85';
const H = { 'X-Set-Id': setId };
if (token) H.Authorization = 'Bearer ' + token;

function setStatus(el, text, kind) {
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { ...H, ...(opts.headers || {}) } });
  if (r.status === 401) throw new Error('登录态已过期：请先打开妆点管账主界面，再从托盘菜单进入本页');
  return r;
}

async function saveBlob(r, fallbackName) {
  const cd = r.headers.get('content-disposition') || '';
  const m = cd.match(/filename\*=UTF-8''([^;]+)/i);
  const name = m ? decodeURIComponent(m[1]) : fallbackName;
  const url = URL.createObjectURL(await r.blob());
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return name;
}

async function loadFormats() {
  try {
    const j = await (await api('/api/export/formats')).json();
    if (!j || j.code !== 0 || !j.data || !Array.isArray(j.data.builtin)) {
      throw new Error('导出服务尚未就绪（后端返回空结构），请退出托盘后重新双击桌面图标重启一次');
    }
    const d = j.data;
    $('#kind').innerHTML = d.reports.map((r, i) =>
      `<option value="${r.key}"${i === 0 ? ' selected' : ''}>${r.label}</option>`).join('');
    const f = d.filee;
    setStatus($('#fileeStatus'),
      f.configured
        ? `Filee 已配置：${f.cli || ''}${f.exists === false ? '（路径不存在，请检查）' : ''}\n支持 ${d.fileeTargets.length}+ 种目标格式；完整清单运行 filee formats。`
        : 'Filee 未配置。内置 CSV / XLSX / HTML / MD / JSON 可直接使用；\n若需转 PDF、DOCX 等，请在 .env 设置 FILEE_CLI 指向 filee-cli.exe。',
      f.configured && f.exists !== false ? 'ok' : '');
  } catch (e) {
    setStatus($('#fileeStatus'), e.message, 'err');
    setStatus($('#genStatus'), e.message, 'err');
  }
}

async function loadFiles() {
  try {
    const j = await (await api('/api/export/files')).json();
    const list = (j && j.code === 0 && Array.isArray(j.data)) ? j.data : [];
    $('#srcFile').innerHTML = list.length
      ? list.map((f) => `<option value="${encodeURIComponent(f.name)}">${esc(f.name)}</option>`).join('')
      : '<option value="">（暂无导出文件）</option>';
    $('#files').innerHTML = list.length
      ? `<table><thead><tr><th>文件名</th><th>大小</th><th>生成时间</th><th></th></tr></thead><tbody>` +
        list.map((f) => `<tr><td>${esc(f.name)}</td><td>${(f.size / 1024).toFixed(1)} KB</td>
          <td>${esc(new Date(f.mtime).toLocaleString('zh-CN'))}</td>
          <td class="act" data-name="${encodeURIComponent(f.name)}">下载</td></tr>`).join('') +
        `</tbody></table>`
      : '<div class="empty">还没有导出记录，先在左侧生成一份报表。</div>';
    $('#files').querySelectorAll('.act').forEach((el) => el.addEventListener('click', async () => {
      try {
        const r = await api('/api/export/download?file=' + el.dataset.name);
        await saveBlob(r, el.dataset.name);
      } catch (e) { setStatus($('#genStatus'), e.message, 'err'); }
    }));
  } catch (e) {
    $('#files').innerHTML = '<div class="empty">' + e.message + '</div>';
  }
}

$('#period').value = new Date().toISOString().slice(0, 7);

$('#gen').addEventListener('click', async () => {
  const btn = $('#gen'); btn.disabled = true;
  setStatus($('#genStatus'), '正在生成…');
  try {
    const qs = new URLSearchParams({
      kind: $('#kind').value, period: $('#period').value, format: $('#format').value,
    });
    const r = await api('/api/export/report?' + qs);
    const ct = r.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
      const j = await r.json();
      throw new Error(j.message || '生成失败');
    }
    const name = await saveBlob(r, 'report.' + $('#format').value);
    setStatus($('#genStatus'), `已生成并下载：${name}`, 'ok');
    await loadFiles();
  } catch (e) {
    setStatus($('#genStatus'), e.message, 'err');
  } finally { btn.disabled = false; }
});

$('#conv').addEventListener('click', async () => {
  const file = $('#srcFile').value;
  if (!file) { setStatus($('#genStatus'), '请先生成并选择一个导出文件', 'err'); return; }
  const btn = $('#conv'); btn.disabled = true;
  setStatus($('#genStatus'), '正在调用 Filee 转换（首次可能较慢）…');
  try {
    const j = await (await api('/api/export/convert', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: decodeURIComponent(file), to: $('#to').value }),
    })).json();
    const d = j.data || {};
    if (!d.ok) throw new Error(d.message || '转换失败');
    const r = await api('/api/export/download?dir=converted&file=' + encodeURIComponent(d.output));
    const name = await saveBlob(r, d.output);
    setStatus($('#genStatus'), `转换完成：${name}`, 'ok');
  } catch (e) {
    setStatus($('#genStatus'), e.message, 'err');
  } finally { btn.disabled = false; }
});

loadFormats().then(loadFiles);
</script>
</body>
</html>
